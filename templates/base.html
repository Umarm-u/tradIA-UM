<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}tradIA{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Exact design tokens from dashboard/css/styles.css ── */
    :root {
      --bg-base:      #060b14;
      --bg-panel:     #0d1421;
      --bg-card:      #111927;
      --bg-elevated:  #152033;
      --bg-hover:     #1a2842;
      --bg-active:    #1e3050;
      --border:       #1a2742;
      --border-light: #243450;
      --border-focus: #2b4a7a;
      --accent:       #1890ff;
      --accent-glow:  rgba(24,144,255,0.20);
      --accent-dim:   rgba(24,144,255,0.12);
      --green:        #0ecb81;
      --green-dim:    rgba(14,203,129,0.12);
      --red:          #f6465d;
      --red-dim:      rgba(246,70,93,0.12);
      --text-1:       #e2e8f0;
      --text-2:       #94a3b8;
      --text-3:       #4a5568;
      --font-ui:   'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 4px;
      --radius:    8px;
      --radius-lg: 12px;
      --shadow:    0 4px 24px rgba(0,0,0,0.5);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
      --transition: 150ms ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: var(--font-ui);
      font-size: 13px;
      background: var(--bg-base);
      color: var(--text-1);
      line-height: 1.5;
      min-height: 100vh;
      display: flex; flex-direction: column;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-panel); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    /* ── Navbar — matches dashboard #navbar exactly ── */
    #navbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 24px;
      height: 52px; padding: 0 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .nav-logo img { width: 140px; height: auto; display: block; }

    .nav-divider { width: 1px; height: 24px; background: var(--border); }

    .nav-links { display: flex; align-items: center; gap: 2px; }
    .nav-link {
      display: inline-flex; align-items: center;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 11px; font-weight: 500;
      color: var(--text-3);
      text-decoration: none;
      transition: background var(--transition), color var(--transition);
      white-space: nowrap;
    }
    .nav-link:hover  { background: var(--bg-card); color: var(--text-1); }
    .nav-link.active { background: var(--accent-dim); color: var(--accent); }

    .nav-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 12px;
    }
    .nav-user {
      font-size: 12px; color: var(--text-2);
      display: flex; align-items: center; gap: 6px;
    }
    .nav-user-dot {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: var(--accent);
      flex-shrink: 0;
    }

    .btn-logout {
      padding: 5px 14px;
      font-size: 11px; font-weight: 600;
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text-2);
      cursor: pointer;
      font-family: var(--font-ui);
      transition: all var(--transition);
      text-decoration: none;
      display: inline-flex; align-items: center;
    }
    .btn-logout:hover { background: var(--bg-hover); color: var(--text-1); }

    /* ── Page content area ── */
    .page-content { flex: 1; display: flex; flex-direction: column; }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>

<header id="navbar">
  <div class="nav-logo">
    <img src="/logo2.svg" alt="tradIA" />
  </div>
  <div class="nav-divider"></div>
  <nav class="nav-links">
    <a class="nav-link {% block dash_active %}{% endblock %}" href="/app">Dashboard</a>
    <a class="nav-link {% block acct_active %}{% endblock %}" href="/account">Account</a>
  </nav>
  <div class="nav-right">
    <div class="nav-user">
      <div class="nav-user-dot">{{ (user_name or 'U')[0].upper() }}</div>
      <span>{{ user_name }}</span>
    </div>
    <div class="nav-divider"></div>
    <a class="btn-logout" href="/logout">Logout</a>
  </div>
</header>

<div class="page-content">
  {% block content %}{% endblock %}
</div>

</body>
</html>
